<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTortilla - Login</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --bg: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            width: 380px;
            text-align: center;
        }
        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 0.3rem; }
        h1 span { color: var(--accent); }
        .subtitle { color: #7f8c8d; margin-bottom: 2rem; }
        input {
            width: 100%; padding: 12px 16px; margin-bottom: 1rem;
            border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: var(--primary); }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: var(--primary); color: white; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--accent); }
        #error {
            color: var(--accent); margin-top: 1rem; display: none;
            font-weight: bold;
        }
        .hint {
            margin-top: 1.5rem; color: #95a5a6; font-size: 0.85rem;
            border-top: 1px solid #eee; padding-top: 1rem;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Air<span>Tortilla</span></h1>
    <p class="subtitle">Sistema de Gestión de Reservas</p>

    <input type="text" id="username" placeholder="👤 Usuario" autocomplete="off">
    <input type="password" id="password" placeholder="🔒 Contraseña">
    <button class="btn" onclick="login()">Iniciar Sesión</button>

    <p id="error">❌ Usuario o contraseña incorrectos</p>

    <p class="hint">
        Usuario por defecto: <b>admin</b> / <b>admin123</b>
    </p>
</div>

<script>
    // Enter para enviar
    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });

    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) return;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
        });

        const data = await res.json();

        if (data.ok) {
            // Guardar sesión en localStorage y redirigir
            localStorage.setItem('usuario', data.username);
            localStorage.setItem('rol', data.rol);
            window.location.href = '/index.html';
        } else {
            document.getElementById('error').style.display = 'block';
        }
    }
</script>
</body>
</html>
